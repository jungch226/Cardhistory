
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1,
               viewport-fit=cover">
<title>법인카드 내역 v2.3</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body {
    background: #f5f6f8;
}

.main {
    max-width: 520px;
    margin: auto;
}

#previewBox {
    width: 100%;
    min-height: 190px;
    border: 2px dashed #cbd5e1;
    border-radius: 10px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#preview {
    display: none;
    max-width: 100%;
    max-height: 320px;
    object-fit: contain;
}

#imageInfo {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.entry {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    overflow-wrap: anywhere;
}

.entry img {
    display: block;
    max-width: 130px;
    max-height: 130px;
    object-fit: contain;
    margin-top: 8px;
}

#cameraLayer {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: #080808;
    display: none;
    flex-direction: column;
}

#cameraHeader {
    color: white;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #151515;
}

#cameraArea {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#cameraVideo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}

#cameraFooter {
    padding: 18px 16px;
    padding-bottom: max(18px, env(safe-area-inset-bottom));
    background: #151515;
    text-align: center;
}

#captureButton {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: white;
    border: 6px solid #999;
    box-shadow: 0 0 0 3px white;
}

#captureButton:disabled {
    opacity: 0.5;
}

#cameraMessage {
    color: #ddd;
    font-size: 13px;
    margin-top: 12px;
}

button {
    touch-action: manipulation;
}
</style>
</head>

<body>

<div class="container py-4">

<h2 class="text-center mb-4">
    법인카드 내역(v2.3)
</h2>

<form id="cardForm" class="main">

    <div class="mb-3">
        <label class="form-label" for="user">
            사용자
        </label>

        <select id="user" class="form-select" required>
            <option value="">선택하세요</option>
            <option>김동혁</option>
            <option>신경용</option>
            <option>정재원</option>
            <option>이주홍</option>
            <option>정채호</option>
            <option>김현재</option>
            <option>조성원</option>
            <option>문성인</option>
            <option>현혜영</option>
            <option>변지호</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label" for="desc">
            내역
        </label>

        <input
            id="desc"
            class="form-control"
            placeholder="예: 식비(정채호)"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label" for="pro">
            프로젝트
        </label>

        <input
            id="pro"
            class="form-control"
            placeholder="예: 순천 형상 모니터링"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label" for="date">
            날짜
        </label>

        <input
            type="date"
            id="date"
            class="form-control"
            required>
    </div>

    <div class="mb-3">

        <div class="d-flex gap-2 mb-2">

            <button
                type="button"
                id="openCameraButton"
                class="btn btn-primary flex-fill">
                카메라 촬영
            </button>

            <button
                type="button"
                id="galleryButton"
                class="btn btn-outline-primary flex-fill">
                갤러리
            </button>

        </div>

        <input
            type="file"
            id="galleryInput"
            accept="image/*"
            hidden>

        <div id="previewBox">
            <span id="previewText" class="text-muted">
                이미지 미리보기
            </span>

            <img
                id="preview"
                alt="영수증 미리보기">
        </div>

        <small
            id="imageInfo"
            class="text-muted d-block mt-2"
            aria-live="polite">
        </small>

        <button
            type="button"
            id="removePhotoButton"
            class="btn btn-sm btn-outline-danger mt-2"
            style="display:none">
            사진 제거
        </button>

    </div>

    <div class="d-grid gap-2">

        <button
            type="submit"
            id="addButton"
            class="btn btn-success">
            내역 추가
        </button>

        <button
            type="button"
            id="shareButton"
            class="btn btn-secondary">
            공유하기 (PDF)
        </button>

        <button
            type="button"
            id="csvButton"
            class="btn btn-outline-secondary">
            CSV 다운로드
        </button>

        <button
            type="button"
            id="clearButton"
            class="btn btn-danger">
            히스토리 초기화
        </button>

    </div>

</form>

<hr>

<div id="historyList" class="main"></div>

</div>

<!-- 웹페이지 내부 카메라 -->

<div id="cameraLayer">

    <div id="cameraHeader">
        <strong>영수증 촬영</strong>

        <button
            type="button"
            id="closeCameraButton"
            class="btn btn-outline-light btn-sm">
            닫기
        </button>
    </div>

    <div id="cameraArea">
        <video
            id="cameraVideo"
            autoplay
            playsinline
            muted>
        </video>
    </div>

    <div id="cameraFooter">

        <button
            type="button"
            id="captureButton"
            aria-label="사진 촬영">
        </button>

        <div id="cameraMessage">
            영수증을 화면에 맞춘 후 촬영하세요.
        </div>

    </div>

</div>

<script>
"use strict";

// ========================================
// 설정
// ========================================

const $ = id => document.getElementById(id);

const DB_NAME = "CardDB";
const DB_VERSION = 1;
const STORE_NAME = "cards";

const MAX_IMAGE_SIDE = 1600;
const JPEG_QUALITY = 0.78;

let db = null;

let cameraStream = null;
let cameraBusy = false;

let photoBlob = null;
let previewURL = null;

let photoBusy = false;
let saveBusy = false;
let photoToken = 0;

let historyURLs = [];

// ========================================
// 공통 함수
// ========================================

function today() {
    const d = new Date();

    return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, "0"),
        String(d.getDate()).padStart(2, "0")
    ].join("-");
}

function formatSize(bytes) {
    if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(0)} KB`;
    }

    return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
}

function setImageInfo(message, error = false) {
    const el = $("imageInfo");

    el.textContent = message;
    el.className =
        "d-block mt-2 " +
        (error ? "text-danger" : "text-muted");
}

function updateAddButton() {
    $("addButton").disabled =
        photoBusy || saveBusy;
}

function sleep(ms) {
    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );
}

// ========================================
// IndexedDB
// ========================================

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(
            DB_NAME,
            DB_VERSION
        );

        request.onupgradeneeded = () => {
            const database = request.result;

            if (!database.objectStoreNames.contains(
                STORE_NAME
            )) {
                const store =
                    database.createObjectStore(
                        STORE_NAME,
                        {
                            keyPath: "id",
                            autoIncrement: true
                        }
                    );

                store.createIndex(
                    "user",
                    "user",
                    { unique: false }
                );
            }
        };

        request.onsuccess = () => {
            db = request.result;
            resolve();
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

function dbOperation(mode, callback) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(
            STORE_NAME,
            mode
        );

        const store =
            transaction.objectStore(STORE_NAME);

        const request = callback(store);

        let result;

        request.onsuccess = () => {
            result = request.result;
        };

        transaction.oncomplete = () => {
            resolve(result);
        };

        transaction.onerror = () => {
            reject(transaction.error);
        };

        transaction.onabort = () => {
            reject(
                transaction.error ||
                Error("DB 작업 취소")
            );
        };
    });
}

function getRecords() {
    return dbOperation(
        "readonly",
        store => store.getAll()
    );
}

function addDB(record) {
    return dbOperation(
        "readwrite",
        store => store.add(record)
    );
}

function deleteDB(id) {
    return dbOperation(
        "readwrite",
        store => store.delete(id)
    );
}

function clearDB() {
    return dbOperation(
        "readwrite",
        store => store.clear()
    );
}

// ========================================
// 사진 관리
// ========================================

function revokePreview() {
    if (previewURL) {
        URL.revokeObjectURL(previewURL);
        previewURL = null;
    }
}

function clearPhoto() {
    photoToken++;

    photoBlob = null;
    photoBusy = false;

    const img = $("preview");

    img.removeAttribute("src");
    img.style.display = "none";

    $("previewText").style.display = "";

    revokePreview();

    $("galleryInput").value = "";

    $("removePhotoButton").style.display = "none";

    setImageInfo("");

    updateAddButton();
}

function showPhoto(blob, message) {
    if (!(blob instanceof Blob)) {
        throw Error("유효하지 않은 이미지입니다.");
    }

    const url = URL.createObjectURL(blob);

    const img = $("preview");

    img.onload = null;
    img.onerror = null;

    img.src = url;
    img.style.display = "block";

    $("previewText").style.display = "none";

    revokePreview();

    previewURL = url;
    photoBlob = blob;

    $("removePhotoButton").style.display =
        "inline-block";

    setImageInfo(message);
}

// ========================================
// Canvas → JPEG Blob
// ========================================

function canvasToJPEG(canvas) {
    return new Promise((resolve, reject) => {
        canvas.toBlob(
            blob => {
                if (!blob) {
                    reject(Error("JPEG 생성 실패"));
                    return;
                }

                if (blob.type !== "image/jpeg") {
                    reject(Error("JPEG 변환 미지원"));
                    return;
                }

                resolve(blob);
            },
            "image/jpeg",
            JPEG_QUALITY
        );
    });
}

// ========================================
// 카메라 시작
// ========================================

async function openCamera() {
    if (cameraBusy || cameraStream) return;

    if (!window.isSecureContext) {
        alert(
            "카메라는 HTTPS 환경에서 실행해야 합니다.\n" +
            "GitHub Pages 주소로 접속해주세요."
        );
        return;
    }

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
        alert(
            "현재 브라우저에서 웹 카메라를 지원하지 않습니다.\n" +
            "갤럭시 Chrome 또는 Samsung Internet을 이용해주세요."
        );
        return;
    }

    cameraBusy = true;

    $("openCameraButton").disabled = true;
    $("cameraLayer").style.display = "flex";
    $("captureButton").disabled = true;

    $("cameraMessage").textContent =
        "카메라를 연결하고 있습니다...";

    try {
        // 갤럭시 후면 카메라 요청
        // 고해상도 사진 모드가 아니라
        // 저해상도 영상 스트림을 사용
        const constraints = {
            audio: false,
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1280
                },
                height: {
                    ideal: 960
                },
                frameRate: {
                    ideal: 15,
                    max: 30
                }
            }
        };

        cameraStream =
            await navigator.mediaDevices.getUserMedia(
                constraints
            );

        const video = $("cameraVideo");

        video.srcObject = cameraStream;

        await video.play();

        // 실제 프레임 준비 대기
        const start = Date.now();

        while (
            (!video.videoWidth || !video.videoHeight) &&
            Date.now() - start < 5000
        ) {
            await sleep(100);
        }

        if (!video.videoWidth || !video.videoHeight) {
            throw Error("카메라 영상이 준비되지 않았습니다.");
        }

        const track =
            cameraStream.getVideoTracks()[0];

        const settings = track.getSettings();

        console.log("카메라 설정:", settings);

        $("cameraMessage").textContent =
            `촬영 준비 완료 (${video.videoWidth}×` +
            `${video.videoHeight})`;

        $("captureButton").disabled = false;

    } catch (error) {
        console.error("카메라 오류:", error);

        closeCamera();

        let message = error.message;

        if (
            error.name === "NotAllowedError" ||
            error.name === "PermissionDeniedError"
        ) {
            message =
                "카메라 권한이 거부되었습니다.\n" +
                "브라우저의 사이트 카메라 권한을 허용해주세요.";
        }

        if (
            error.name === "NotFoundError" ||
            error.name === "OverconstrainedError"
        ) {
            message =
                "사용 가능한 카메라를 찾지 못했습니다.";
        }

        if (error.name === "NotReadableError") {
            message =
                "다른 앱에서 카메라를 사용 중일 수 있습니다.\n" +
                "기본 카메라 앱을 종료하고 다시 시도해주세요.";
        }

        alert("카메라 실행 실패\n" + message);

    } finally {
        cameraBusy = false;
        $("openCameraButton").disabled = false;
    }
}

// ========================================
// 카메라 종료
// ========================================

function closeCamera() {
    const video = $("cameraVideo");

    video.pause();
    video.srcObject = null;

    if (cameraStream) {
        cameraStream.getTracks().forEach(track => {
            track.stop();
        });

        cameraStream = null;
    }

    $("cameraLayer").style.display = "none";
    $("captureButton").disabled = false;
}

// ========================================
// 사진 촬영
// ========================================

async function capturePhoto() {
    if (!cameraStream || photoBusy) return;

    const video = $("cameraVideo");

    if (!video.videoWidth || !video.videoHeight) {
        alert("카메라 영상이 준비되지 않았습니다.");
        return;
    }

    photoBusy = true;
    $("captureButton").disabled = true;

    updateAddButton();

    let canvas = null;

    try {
        const sourceW = video.videoWidth;
        const sourceH = video.videoHeight;

        const scale = Math.min(
            1,
            MAX_IMAGE_SIDE / Math.max(
                sourceW,
                sourceH
            )
        );

        const width = Math.max(
            1,
            Math.round(sourceW * scale)
        );

        const height = Math.max(
            1,
            Math.round(sourceH * scale)
        );

        // 원본 고해상도 파일 생성 없이
        // 영상 프레임을 바로 JPEG로 저장
        canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d", {
            alpha: false
        });

        if (!ctx) {
            throw Error("Canvas 생성 실패");
        }

        ctx.drawImage(
            video,
            0,
            0,
            width,
            height
        );

        const blob = await canvasToJPEG(canvas);

        // 카메라를 먼저 종료해 메모리 반환
        closeCamera();

        clearPhoto();

        showPhoto(
            blob,
            `촬영 완료: ${width}×${height} / ` +
            `${formatSize(blob.size)}`
        );

    } catch (error) {
        console.error("촬영 실패:", error);

        alert(
            "사진 촬영 실패\n" +
            error.message
        );

    } finally {
        if (canvas) {
            canvas.width = 0;
            canvas.height = 0;
        }

        photoBusy = false;

        $("captureButton").disabled = false;

        updateAddButton();
    }
}

// ========================================
// 갤러리 이미지 로딩
// ========================================

function loadImage(url) {
    return new Promise((resolve, reject) => {
        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () => reject(
            Error("이미지를 읽지 못했습니다.")
        );

        img.src = url;
    });
}

// ========================================
// 갤러리 이미지 압축
// ========================================

async function compressGalleryImage(file) {
    let url = null;
    let canvas = null;
    let bitmap = null;

    try {
        let source;

        // 브라우저가 지원하면 축소 디코딩
        if (typeof createImageBitmap === "function") {
            try {
                bitmap = await createImageBitmap(
                    file,
                    {
                        imageOrientation: "from-image",
                        resizeWidth: MAX_IMAGE_SIDE,
                        resizeQuality: "high"
                    }
                );

                source = bitmap;

            } catch (error) {
                console.warn(
                    "ImageBitmap 실패, 일반 로딩:",
                    error
                );
            }
        }

        if (!source) {
            url = URL.createObjectURL(file);
            source = await loadImage(url);
        }

        const sw =
            source.naturalWidth || source.width;

        const sh =
            source.naturalHeight || source.height;

        if (!sw || !sh) {
            throw Error("이미지 크기 확인 실패");
        }

        const scale = Math.min(
            1,
            MAX_IMAGE_SIDE / Math.max(sw, sh)
        );

        const width = Math.max(
            1,
            Math.round(sw * scale)
        );

        const height = Math.max(
            1,
            Math.round(sh * scale)
        );

        canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d", {
            alpha: false
        });

        if (!ctx) {
            throw Error("Canvas 생성 실패");
        }

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, width, height);

        ctx.drawImage(
            source,
            0,
            0,
            width,
            height
        );

        const blob = await canvasToJPEG(canvas);

        return {
            blob,
            width,
            height
        };

    } finally {
        if (bitmap) bitmap.close();

        if (url) URL.revokeObjectURL(url);

        if (canvas) {
            canvas.width = 0;
            canvas.height = 0;
        }
    }
}

// ========================================
// 갤러리 선택
// ========================================

async function chooseGallery(event) {
    const file = event.target.files?.[0];

    if (!file) return;

    if (photoBusy) return;

    clearPhoto();

    const token = ++photoToken;

    photoBusy = true;
    updateAddButton();

    setImageInfo(
        `갤러리 사진 처리 중... ${formatSize(file.size)}`
    );

    try {
        const result = await compressGalleryImage(file);

        if (token !== photoToken) return;

        showPhoto(
            result.blob,
            `갤러리 사진: ${result.width}×` +
            `${result.height} / ` +
            `${formatSize(result.blob.size)}`
        );

    } catch (error) {
        console.error("갤러리 오류:", error);

        if (token === photoToken) {
            setImageInfo(
                "갤러리 이미지 처리 실패: " +
                error.message,
                true
            );

            alert(
                "사진을 읽지 못했습니다.\n" +
                error.message
            );
        }

    } finally {
        if (token === photoToken) {
            photoBusy = false;
            updateAddButton();
        }
    }
}

// ========================================
// 내역 등록
// ========================================

async function addRecord(event) {
    event.preventDefault();

    if (photoBusy || saveBusy) return;

    const user = $("user").value.trim();
    const desc = $("desc").value.trim();
    const pro = $("pro").value.trim();
    const date = $("date").value;

    if (!user || !desc || !pro || !date) {
        alert("모든 항목을 입력해주세요.");
        return;
    }

    saveBusy = true;
    updateAddButton();

    try {
        const record = {
            user,
            desc,
            pro,
            date,
            photo: photoBlob || ""
        };

        await addDB(record);

        localStorage.setItem(
            "selectedUser",
            user
        );

        localStorage.setItem(
            "wdesc",
            desc
        );

        localStorage.setItem(
            "wpro",
            pro
        );

        clearPhoto();

        await renderHistory();

        alert("내역이 등록되었습니다.");

    } catch (error) {
        console.error("저장 오류:", error);

        alert(
            "내역 저장 실패\n" +
            error.message
        );

    } finally {
        saveBusy = false;
        updateAddButton();
    }
}

// ========================================
// 기존 Base64 호환
// ========================================

function getPhotoURL(photo) {
    if (!photo) return null;

    if (photo instanceof Blob) {
        return {
            url: URL.createObjectURL(photo),
            temporary: true
        };
    }

    if (
        typeof photo === "string" &&
        photo.startsWith("data:image/")
    ) {
        return {
            url: photo,
            temporary: false
        };
    }

    return null;
}

// ========================================
// 히스토리
// ========================================

async function renderHistory() {
    const list = $("historyList");

    list.replaceChildren();

    historyURLs.forEach(url => {
        URL.revokeObjectURL(url);
    });

    historyURLs = [];

    const all = await getRecords();

    all.sort((a, b) => b.id - a.id);

    if (!all.length) {
        const empty = document.createElement("p");

        empty.className =
            "text-center text-muted";

        empty.textContent =
            "등록된 내역이 없습니다.";

        list.append(empty);
        return;
    }

    for (const record of all) {
        const card = document.createElement("div");

        card.className =
            "entry d-flex justify-content-between " +
            "align-items-start gap-2";

        const content = document.createElement("div");
        content.style.minWidth = "0";

        const title = document.createElement("strong");

        title.textContent =
            `${record.user} (${record.date})`;

        content.append(title);

        const desc = document.createElement("div");
        desc.textContent =
            `내역: ${record.desc}`;

        const pro = document.createElement("div");
        pro.textContent =
            `프로젝트: ${record.pro}`;

        content.append(desc, pro);

        const photo = getPhotoURL(record.photo);

        if (photo) {
            const img = document.createElement("img");

            img.src = photo.url;
            img.loading = "lazy";
            img.alt = "영수증";

            content.append(img);

            if (photo.temporary) {
                historyURLs.push(photo.url);
            }
        }

        const del = document.createElement("button");

        del.type = "button";
        del.className = "btn btn-sm btn-danger";
        del.textContent = "삭제";

        del.onclick = async () => {
            if (!confirm("정말 삭제하시겠습니까?")) {
                return;
            }

            try {
                await deleteDB(record.id);
                await renderHistory();
            } catch (error) {
                alert("삭제 실패: " + error.message);
            }
        };

        card.append(content, del);
        list.append(card);
    }
}

// ========================================
// CSV
// ========================================

function escapeCSV(value) {
    return '"' +
        String(value ?? "").replace(/"/g, '""') +
        '"';
}

function createCSV(all) {
    const lines = [
        "No.,날짜,사용자,프로젝트,내역"
    ];

    all.forEach((r, i) => {
        lines.push(
            [
                i + 1,
                r.date,
                r.user,
                r.pro,
                r.desc
            ].map(escapeCSV).join(",")
        );
    });

    return new File(
        ["\uFEFF" + lines.join("\r\n")],
        `법인카드내역_${today()}.csv`,
        { type: "text/csv;charset=utf-8" }
    );
}

// ========================================
// 파일 다운로드
// ========================================

function downloadFile(file) {
    const url = URL.createObjectURL(file);

    const a = document.createElement("a");

    a.href = url;
    a.download = file.name;

    document.body.append(a);
    a.click();
    a.remove();

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 60000);
}

// ========================================
// Base64 → Blob
// ========================================

function dataURLToBlob(dataURL) {
    const parts = dataURL.split(",");

    const mime =
        (parts[0].match(/data:([^;]+)/) || [])[1] ||
        "image/jpeg";

    const binary = atob(parts[1]);

    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return new Blob(
        [bytes],
        { type: mime }
    );
}

// ========================================
// Blob → Data URL
// ========================================

function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => {
            resolve(reader.result);
        };

        reader.onerror = () => {
            reject(reader.error);
        };

        reader.readAsDataURL(blob);
    });
}

// ========================================
// PDF 한글 텍스트
// ========================================

function makeTextImage(lines) {
    const canvas = document.createElement("canvas");

    const width = 800;
    const padding = 25;
    const lineHeight = 38;

    canvas.width = width;

    const measure = canvas.getContext("2d");

    measure.font = "26px sans-serif";

    const wrapped = [];

    for (const line of lines) {
        let current = "";

        for (const char of line) {
            if (
                current &&
                measure.measureText(
                    current + char
                ).width > width - padding * 2
            ) {
                wrapped.push(current);
                current = char;
            } else {
                current += char;
            }
        }

        wrapped.push(current);
    }

    canvas.height =
        padding * 2 +
        wrapped.length * lineHeight;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "#000000";
    ctx.font = "26px sans-serif";
    ctx.textBaseline = "top";

    wrapped.forEach((line, index) => {
        ctx.fillText(
            line,
            padding,
            padding + index * lineHeight
        );
    });

    const result = {
        data: canvas.toDataURL("image/png"),
        ratio: canvas.height / canvas.width
    };

    canvas.width = 0;
    canvas.height = 0;

    return result;
}

// ========================================
// PDF 생성
// ========================================

async function sharePDF() {
    const button = $("shareButton");

    button.disabled = true;

    try {
        const all = await getRecords();

        if (!all.length) {
            alert("등록된 내역이 없습니다.");
            return;
        }

        if (!window.jspdf) {
            throw Error(
                "PDF 라이브러리를 불러오지 못했습니다."
            );
        }

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF({
            unit: "mm",
            format: "a4",
            compress: true
        });

        const pageW =
            pdf.internal.pageSize.getWidth();

        const pageH =
            pdf.internal.pageSize.getHeight();

        const margin = 10;
        const imageW = 65;
        const textX = 80;
        const textW = pageW - textX - margin;

        let y = margin;

        for (let i = 0; i < all.length; i++) {
            const record = all[i];

            button.textContent =
                `PDF 생성 ${i + 1}/${all.length}`;

            const text = makeTextImage([
                `사용자: ${record.user}`,
                `날짜: ${record.date}`,
                `프로젝트: ${record.pro}`,
                `내역: ${record.desc}`
            ]);

            let imageData = null;
            let iw = 0;
            let ih = 0;

            if (record.photo) {
                try {
                    const source =
                        record.photo instanceof Blob
                            ? record.photo
                            : dataURLToBlob(record.photo);

                    const compressed =
                        await compressGalleryImage(source);

                    imageData =
                        await blobToDataURL(compressed.blob);

                    iw = imageW;

                    ih = imageW *
                        compressed.height /
                        compressed.width;

                } catch (error) {
                    console.warn(
                        "PDF 이미지 처리 실패:",
                        error
                    );
                }
            }

            const textH = textW * text.ratio;

            const scale = Math.min(
                1,
                (pageH - margin * 2) /
                Math.max(textH, ih, 1)
            );

            const rowH =
                Math.max(textH, ih) * scale;

            if (
                y + rowH > pageH - margin &&
                y > margin
            ) {
                pdf.addPage();
                y = margin;
            }

            if (imageData) {
                pdf.addImage(
                    imageData,
                    "JPEG",
                    margin,
                    y,
                    iw * scale,
                    ih * scale,
                    undefined,
                    "FAST"
                );
            }

            pdf.addImage(
                text.data,
                "PNG",
                textX,
                y,
                textW * scale,
                textH * scale,
                undefined,
                "FAST"
            );

            y += rowH + 6;

            await sleep(0);
        }

        const file = new File(
            [pdf.output("blob")],
            `법인카드사진_${today()}.pdf`,
            { type: "application/pdf" }
        );

        if (
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {
            try {
                await navigator.share({
                    files: [file],
                    title: "법인카드 내역",
                    text: `법인카드 내역 (${today()})`
                });

            } catch (error) {
                if (error.name !== "AbortError") {
                    console.error(error);
                    downloadFile(file);
                }
            }
        } else {
            downloadFile(file);
        }

    } catch (error) {
        console.error("PDF 오류:", error);

        alert(
            "PDF 생성 실패\n" +
            error.message
        );

    } finally {
        button.disabled = false;
        button.textContent = "공유하기 (PDF)";
    }
}

// ========================================
// 초기화
// ========================================

async function initialize() {
    try {
        await openDB();

        $("user").value =
            localStorage.getItem("selectedUser") || "";

        $("desc").value =
            localStorage.getItem("wdesc") || "";

        $("pro").value =
            localStorage.getItem("wpro") || "";

        $("date").value = today();

        $("user").addEventListener(
            "change",
            () => {
                localStorage.setItem(
                    "selectedUser",
                    $("user").value
                );
            }
        );

        // 웹 카메라 실행
        $("openCameraButton").addEventListener(
            "click",
            openCamera
        );

        // 웹 카메라 종료
        $("closeCameraButton").addEventListener(
            "click",
            closeCamera
        );

        // 웹 카메라 촬영
        $("captureButton").addEventListener(
            "click",
            capturePhoto
        );

        // 갤러리 선택
        $("galleryButton").addEventListener(
            "click",
            () => {
                $("galleryInput").value = "";
                $("galleryInput").click();
            }
        );

        $("galleryInput").addEventListener(
            "change",
            chooseGallery
        );

        // 사진 제거
        $("removePhotoButton").addEventListener(
            "click",
            clearPhoto
        );

        // 내역 추가
        $("cardForm").addEventListener(
            "submit",
            addRecord
        );

        // PDF 공유
        $("shareButton").addEventListener(
            "click",
            sharePDF
        );

        // CSV 다운로드
        $("csvButton").addEventListener(
            "click",
            async () => {
                try {
                    const all = await getRecords();

                    if (!all.length) {
                        alert("등록된 내역이 없습니다.");
                        return;
                    }

                    downloadFile(createCSV(all));

                } catch (error) {
                    alert(
                        "CSV 다운로드 실패\n" +
                        error.message
                    );
                }
            }
        );

        // 전체 삭제
        $("clearButton").addEventListener(
            "click",
            async () => {
                if (!confirm(
                    "모든 내역을 삭제하시겠습니까?"
                )) {
                    return;
                }

                try {
                    await clearDB();
                    await renderHistory();

                } catch (error) {
                    alert(
                        "초기화 실패\n" +
                        error.message
                    );
                }
            }
        );

        // 페이지 이동 시 카메라 종료
        window.addEventListener(
            "pagehide",
            closeCamera
        );

        document.addEventListener(
            "visibilitychange",
            () => {
                if (document.hidden && cameraStream) {
                    closeCamera();
                }
            }
        );

        await renderHistory();

        console.log(
            "법인카드 내역 v2.3 초기화 완료"
        );

    } catch (error) {
        console.error("초기화 오류:", error);

        alert(
            "프로그램 초기화 실패\n" +
            error.message
        );
    }
}

initialize();
