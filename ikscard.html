
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법인카드 내역 v2.1</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body {
    background-color: #f8f9fa;
}

.main-form {
    max-width: 480px;
    margin: 0 auto;
}

#previewBox {
    width: 100%;
    max-width: 300px;
    height: 180px;
    border: 2px dashed #ced4da;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    color: #6c757d;
    overflow: hidden;
    margin-top: 8px;
}

#preview {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: none;
}

.history-card {
    background: #fff;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    overflow-wrap: anywhere;
}

.history-photo {
    display: block;
    max-width: 120px;
    max-height: 120px;
    object-fit: contain;
    margin-top: 8px;
}

#imageInfo {
    display: block;
    margin-top: 6px;
    font-size: 12px;
}

button:disabled {
    opacity: 0.6;
}
</style>
</head>

<body>

<div class="container py-4">

<h2 class="text-center mb-4">
    법인카드 내역(v2.1)
</h2>

<form id="cardForm" class="main-form">

    <div class="mb-3">
        <label for="user" class="form-label">사용자</label>

        <select id="user" class="form-select" required>
            <option value="">선택하세요</option>
            <option>김동혁</option>
            <option>신경용</option>
            <option>정재원</option>
            <option>이주홍</option>
            <option>정채호</option>
            <option>조성원</option>
            <option>문성인</option>
            <option>변지호</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="desc" class="form-label">내역</label>

        <input
            type="text"
            id="desc"
            class="form-control"
            placeholder="예: 식비(정채호)"
            required>
    </div>

    <div class="mb-3">
        <label for="pro" class="form-label">프로젝트</label>

        <input
            type="text"
            id="pro"
            class="form-control"
            placeholder="예: 순천 POSCO 형상 모니터링"
            required>
    </div>

    <div class="mb-3">
        <label for="date" class="form-label">날짜</label>

        <input
            type="date"
            id="date"
            class="form-control"
            required>
    </div>

    <div class="mb-3">

        <button
            type="button"
            id="photoButton"
            class="btn btn-primary">
            사진 업로드
        </button>

        <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            hidden>

        <input
            type="file"
            id="galleryInput"
            accept="image/*"
            hidden>

        <div id="previewBox">
            <span id="previewText">이미지 미리보기</span>
            <img id="preview" alt="미리보기">
        </div>

        <small id="imageInfo" class="text-muted"></small>

    </div>

    <div class="d-grid gap-2">

        <button
            type="submit"
            id="addButton"
            class="btn btn-success">
            내역 추가
        </button>

        <button
            type="button"
            id="shareButton"
            class="btn btn-secondary">
            공유하기
        </button>

        <button
            type="button"
            id="csvButton"
            class="btn btn-outline-secondary">
            CSV 다운로드
        </button>

        <button
            type="button"
            id="clearButton"
            class="btn btn-danger">
            히스토리 초기화
        </button>

    </div>
</form>

<hr>

<div id="historyList" class="main-form"></div>

</div>

<script>
"use strict";

// =======================================
// 기본 설정
// =======================================

const VERSION = "2.1";

const DB_NAME = "CardDB";
const DB_VERSION = 1;
const STORE_NAME = "cards";

const MAX_IMAGE_SIZE = 1600;
const JPEG_QUALITY = 0.80;

const $ = id => document.getElementById(id);

let db = null;

let selectedPhoto = null;
let previewUrl = null;
let processingPhoto = false;
let savingRecord = false;
let imageTaskId = 0;

let historyUrls = [];

// =======================================
// 공통 함수
// =======================================

function todayString() {
    const now = new Date();

    const year = now.getFullYear();
    const month = String(
        now.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        now.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function formatKB(bytes) {
    return (bytes / 1024).toFixed(0) + " KB";
}

function wait(ms = 0) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// =======================================
// IndexedDB
// =======================================

function openDB() {
    return new Promise((resolve, reject) => {

        const request = indexedDB.open(
            DB_NAME,
            DB_VERSION
        );

        request.onupgradeneeded = event => {
            const database = event.target.result;

            if (!database.objectStoreNames.contains(STORE_NAME)) {
                const store = database.createObjectStore(
                    STORE_NAME,
                    {
                        keyPath: "id",
                        autoIncrement: true
                    }
                );

                store.createIndex(
                    "user",
                    "user",
                    { unique: false }
                );
            }
        };

        request.onsuccess = event => {
            db = event.target.result;
            resolve();
        };

        request.onerror = () => {
            reject(request.error);
        };

        request.onblocked = () => {
            console.warn("IndexedDB가 다른 탭에서 사용 중입니다.");
        };
    });
}

function dbRequest(mode, callback) {
    return new Promise((resolve, reject) => {

        const tx = db.transaction(
            STORE_NAME,
            mode
        );

        const store = tx.objectStore(STORE_NAME);
        const request = callback(store);

        let result;

        request.onsuccess = () => {
            result = request.result;
        };

        tx.oncomplete = () => resolve(result);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(
            tx.error || new Error("DB 작업 취소")
        );
    });
}

function addDB(record) {
    return dbRequest(
        "readwrite",
        store => store.add(record)
    );
}

function deleteDB(id) {
    return dbRequest(
        "readwrite",
        store => store.delete(id)
    );
}

function clearDB() {
    return dbRequest(
        "readwrite",
        store => store.clear()
    );
}

function getAllRecords() {
    return dbRequest(
        "readonly",
        store => store.getAll()
    );
}

// =======================================
// 이미지 로딩
// =======================================

function loadImage(url) {
    return new Promise((resolve, reject) => {

        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () => reject(
            new Error("이미지 로딩 실패")
        );

        img.src = url;
    });
}

// Blob 이미지 압축
async function compressImage(file) {

    let bitmap = null;
    let img = null;
    let sourceUrl = null;
    let canvas = null;

    try {

        // 우선 ImageBitmap을 이용해 디코딩
        // 실패하면 일반 Image 방식으로 전환
        if (typeof createImageBitmap === "function") {
            try {
                bitmap = await createImageBitmap(file);
            } catch (error) {
                console.warn(
                    "ImageBitmap 실패, Image 방식 사용",
                    error
                );
            }
        }

        if (bitmap) {
            img = bitmap;
        } else {
            sourceUrl = URL.createObjectURL(file);
            img = await loadImage(sourceUrl);
        }

        const originalWidth = img.width;
        const originalHeight = img.height;

        if (!originalWidth || !originalHeight) {
            throw new Error("이미지 크기 확인 실패");
        }

        const scale = Math.min(
            1,
            MAX_IMAGE_SIZE /
            Math.max(originalWidth, originalHeight)
        );

        const width = Math.max(
            1,
            Math.round(originalWidth * scale)
        );

        const height = Math.max(
            1,
            Math.round(originalHeight * scale)
        );

        canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d", {
            alpha: false
        });

        if (!ctx) {
            throw new Error("Canvas 생성 실패");
        }

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, width, height);

        ctx.drawImage(
            img,
            0,
            0,
            width,
            height
        );

        const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(
                result => {
                    if (result) {
                        resolve(result);
                    } else {
                        reject(
                            new Error("JPEG 압축 실패")
                        );
                    }
                },
                "image/jpeg",
                JPEG_QUALITY
            );
        });

        return {
            blob,
            width,
            height
        };

    } finally {

        if (bitmap) {
            bitmap.close();
        }

        if (sourceUrl) {
            URL.revokeObjectURL(sourceUrl);
        }

        if (canvas) {
            canvas.width = 0;
            canvas.height = 0;
        }
    }
}

// =======================================
// 사진 미리보기
// =======================================

function releasePreview() {
    if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
    }
}

function resetPhoto() {

    imageTaskId++;

    selectedPhoto = null;
    processingPhoto = false;

    const preview = $("preview");

    preview.onload = null;
    preview.onerror = null;

    preview.removeAttribute("src");
    preview.style.display = "none";

    $("previewText").style.display = "block";
    $("imageInfo").textContent = "";

    releasePreview();

    $("cameraInput").value = "";
    $("galleryInput").value = "";

    $("addButton").disabled = savingRecord;
}

async function previewImage(event) {

    const file = event.target.files?.[0];

    if (!file) return;

    if (processingPhoto) {
        alert("사진 처리 중입니다.");
        return;
    }

    resetPhoto();

    const taskId = ++imageTaskId;

    processingPhoto = true;
    $("addButton").disabled = true;

    const preview = $("preview");

    let originalUrl = null;
    let compressedUrl = null;

    try {

        // 1. 원본 사진을 미리보기에 먼저 표시
        originalUrl = URL.createObjectURL(file);

        preview.onload = () => {
            if (taskId !== imageTaskId) return;

            preview.style.display = "block";
            $("previewText").style.display = "none";
        };

        preview.onerror = () => {
            console.warn("원본 미리보기 표시 실패");
        };

        preview.src = originalUrl;

        $("imageInfo").textContent =
            "사진을 압축하고 있습니다...";

        // 화면 갱신 기회 제공
        await wait(50);

        // 2. 사진 압축
        const result = await compressImage(file);

        if (taskId !== imageTaskId) return;

        selectedPhoto = result.blob;

        // 3. 압축된 사진으로 미리보기 교체
        compressedUrl = URL.createObjectURL(result.blob);

        // 압축 이미지 로딩 확인
        await loadImage(compressedUrl);

        if (taskId !== imageTaskId) return;

        preview.onload = null;
        preview.onerror = null;

        preview.src = compressedUrl;
        preview.style.display = "block";

        $("previewText").style.display = "none";

        previewUrl = compressedUrl;
        compressedUrl = null;

        const reduction = (
            (1 - result.blob.size / file.size) * 100
        ).toFixed(1);

        $("imageInfo").textContent =
            `압축 완료: ${formatKB(file.size)} → ` +
            `${formatKB(result.blob.size)} ` +
            `(${result.width}×${result.height}, ` +
            `${reduction}% 감소)`;

        console.log("사진 처리 완료", {
            original: file.size,
            compressed: result.blob.size,
            width: result.width,
            height: result.height
        });

    } catch (error) {

        console.error("사진 처리 오류:", error);

        if (taskId === imageTaskId) {
            selectedPhoto = null;

            $("imageInfo").textContent =
                "사진 처리 실패. 다시 촬영해주세요.";

            alert(
                "사진 처리 실패\n" +
                error.message
            );
        }

    } finally {

        if (originalUrl) {
            URL.revokeObjectURL(originalUrl);
        }

        if (compressedUrl) {
            URL.revokeObjectURL(compressedUrl);
        }

        if (taskId === imageTaskId) {
            processingPhoto = false;
            $("addButton").disabled = savingRecord;
        }
    }
}

// =======================================
// 카메라 / 갤러리 선택
// =======================================

function showChoice() {

    if (processingPhoto) {
        alert("사진 처리 중입니다.");
        return;
    }

    const camera = confirm(
        "사진을 직접 촬영하시겠습니까?\n\n" +
        "확인: 카메라\n" +
        "취소: 갤러리"
    );

    if (camera) {
        $("cameraInput").click();
    } else {
        $("galleryInput").click();
    }
}

// =======================================
// 내역 추가
// =======================================

async function addRecord(event) {

    event.preventDefault();

    if (savingRecord) return;

    if (processingPhoto) {
        alert("사진 압축이 완료된 후 등록해주세요.");
        return;
    }

    const user = $("user").value.trim();
    const desc = $("desc").value.trim();
    const pro = $("pro").value.trim();
    const date = $("date").value;

    if (!user || !desc || !pro || !date) {
        alert("모든 항목을 입력해주세요.");
        return;
    }

    savingRecord = true;
    $("addButton").disabled = true;

    try {

        const record = {
            user,
            desc,
            pro,
            date,
            photo: selectedPhoto || ""
        };

        await addDB(record);

        localStorage.setItem("selectedUser", user);
        localStorage.setItem("wdesc", desc);
        localStorage.setItem("wpro", pro);

        resetPhoto();

        // 기존 입력값 유지
        $("user").value = user;
        $("desc").value = desc;
        $("pro").value = pro;
        $("date").value = date;

        await renderHistory();

    } catch (error) {

        console.error("저장 오류:", error);

        alert(
            "내역 저장 실패\n" +
            "브라우저 저장 공간을 확인해주세요."
        );

    } finally {

        savingRecord = false;
        $("addButton").disabled = processingPhoto;
    }
}

// =======================================
// 기존 Base64 / 신규 Blob 호환
// =======================================

function photoToUrl(photo) {

    if (!photo) return null;

    if (photo instanceof Blob) {
        return {
            url: URL.createObjectURL(photo),
            temporary: true
        };
    }

    if (
        typeof photo === "string" &&
        photo.startsWith("data:image/")
    ) {
        return {
            url: photo,
            temporary: false
        };
    }

    return null;
}

// =======================================
// 히스토리
// =======================================

function releaseHistoryUrls() {

    for (const url of historyUrls) {
        URL.revokeObjectURL(url);
    }

    historyUrls = [];
}

async function renderHistory() {

    const list = $("historyList");

    list.replaceChildren();
    releaseHistoryUrls();

    try {

        const history = await getAllRecords();

        history.sort((a, b) => b.id - a.id);

        if (history.length === 0) {
            const empty = document.createElement("p");
            empty.className = "text-center text-muted";
            empty.textContent = "등록된 내역이 없습니다.";
            list.appendChild(empty);
            return;
        }

        for (const record of history) {

            const wrapper = document.createElement("div");
            wrapper.className = "history-card";

            const row = document.createElement("div");
            row.className =
                "d-flex justify-content-between align-items-start";

            const left = document.createElement("div");
            left.style.minWidth = "0";

            const title = document.createElement("b");
            title.textContent =
                `${record.user} (${record.date})`;

            const desc = document.createElement("div");
            desc.textContent =
                `내역: ${record.desc}`;

            const pro = document.createElement("div");
            pro.textContent =
                `프로젝트: ${record.pro}`;

            left.append(title, desc, pro);

            const photo = photoToUrl(record.photo);

            if (photo) {

                const img = document.createElement("img");

                img.src = photo.url;
                img.className = "history-photo";
                img.loading = "lazy";
                img.alt = "영수증 사진";

                left.appendChild(img);

                if (photo.temporary) {
                    historyUrls.push(photo.url);
                }
            }

            const delBtn = document.createElement("button");

            delBtn.className =
                "btn btn-sm btn-danger ms-2";

            delBtn.textContent = "삭제";

            delBtn.onclick = () => {
                deleteRecord(record.id);
            };

            row.append(left, delBtn);
            wrapper.appendChild(row);
            list.appendChild(wrapper);
        }

    } catch (error) {

        console.error("히스토리 오류:", error);
        alert("히스토리 조회 실패");
    }
}

// =======================================
// 개별 삭제
// =======================================

async function deleteRecord(id) {

    if (!confirm("정말 삭제하시겠습니까?")) {
        return;
    }

    try {
        await deleteDB(id);
        await renderHistory();
    } catch (error) {
        console.error(error);
        alert("삭제 실패");
    }
}

// =======================================
// 전체 삭제
// =======================================

async function clearHistory() {

    if (!confirm("모든 내역을 삭제하시겠습니까?")) {
        return;
    }

    try {
        await clearDB();
        await renderHistory();
    } catch (error) {
        console.error(error);
        alert("초기화 실패");
    }
}

// =======================================
// PDF 한글 텍스트 이미지
// =======================================

function createTextImage(lines) {

    const width = 900;
    const padding = 30;
    const fontSize = 28;
    const lineHeight = 43;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    ctx.font = `${fontSize}px sans-serif`;

    const wrapped = [];

    for (const line of lines) {

        let current = "";

        for (const ch of line) {

            const next = current + ch;

            if (
                current &&
                ctx.measureText(next).width >
                width - padding * 2
            ) {
                wrapped.push(current);
                current = ch;
            } else {
                current = next;
            }
        }

        wrapped.push(current);
    }

    const height =
        padding * 2 + wrapped.length * lineHeight;

    canvas.width = width;
    canvas.height = height;

    const c = canvas.getContext("2d");

    c.fillStyle = "#FFFFFF";
    c.fillRect(0, 0, width, height);

    c.fillStyle = "#000000";
    c.font = `${fontSize}px sans-serif`;
    c.textBaseline = "top";

    wrapped.forEach((line, index) => {
        c.fillText(
            line,
            padding,
            padding + index * lineHeight
        );
    });

    const data = canvas.toDataURL("image/png");

    canvas.width = 0;
    canvas.height = 0;

    return {
        data,
        width,
        height
    };
}

// =======================================
// Base64 → Blob
// =======================================

function dataUrlToBlob(dataUrl) {

    const parts = dataUrl.split(",");

    const mime = parts[0].match(/:(.*?);/)[1];

    const binary = atob(parts[1]);

    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return new Blob(
        [bytes],
        { type: mime }
    );
}

// =======================================
// Blob → Base64
// =======================================

function blobToDataUrl(blob) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);

        reader.onerror = () => reject(reader.error);

        reader.readAsDataURL(blob);
    });
}

// =======================================
// PDF 사진 준비
// =======================================

async function getPdfPhoto(photo) {

    if (!photo) return null;

    let blob;

    if (photo instanceof Blob) {
        blob = photo;
    } else {
        blob = dataUrlToBlob(photo);
    }

    // 이전 버전의 원본 사진도 압축
    return await compressImage(blob);
}

// =======================================
// CSV 생성
// =======================================

function escapeCSV(value) {

    return '"' +
        String(value ?? "").replace(/"/g, '""') +
        '"';
}

function createCSV(history) {

    let csv =
        "No.,날짜,사용자,프로젝트,내역\r\n";

    history.forEach((r, index) => {

        const row = [
            index + 1,
            escapeCSV(r.date),
            escapeCSV(r.user),
            escapeCSV(r.pro),
            escapeCSV(r.desc)
        ];

        csv += row.join(",") + "\r\n";
    });

    return new File(
        ["\uFEFF" + csv],
        `법인카드내역_${todayString()}.csv`,
        { type: "text/csv;charset=utf-8" }
    );
}

// =======================================
// 파일 다운로드
// =======================================

function downloadFile(file) {

    const url = URL.createObjectURL(file);

    const a = document.createElement("a");

    a.href = url;
    a.download = file.name;

    document.body.appendChild(a);

    a.click();
    a.remove();

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 60000);
}

async function downloadCSV() {

    try {

        const history = await getAllRecords();

        if (!history.length) {
            alert("저장된 내역이 없습니다.");
            return;
        }

        const file = createCSV(history);
        downloadFile(file);

    } catch (error) {
        console.error(error);
        alert("CSV 생성 실패");
    }
}

// =======================================
// PDF 생성 및 공유
// =======================================

async function sendAllMail() {

    const button = $("shareButton");

    button.disabled = true;
    button.textContent = "PDF 생성 중...";

    try {

        const history = await getAllRecords();

        if (history.length === 0) {
            alert("저장된 내역이 없습니다.");
            return;
        }

        const { jsPDF } = window.jspdf;

        const doc = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4",
            compress: true
        });

        const pageWidth =
            doc.internal.pageSize.getWidth();

        const pageHeight =
            doc.internal.pageSize.getHeight();

        const margin = 10;
        const gap = 6;

        const photoWidth = 65;
        const textX = 80;
        const textWidth =
            pageWidth - textX - margin;

        let y = margin;

        for (let i = 0; i < history.length; i++) {

            const r = history[i];

            button.textContent =
                `PDF 생성 중... ${i + 1}/${history.length}`;

            const lines = [
                `사용자: ${r.user}`,
                `날짜: ${r.date}`,
                `프로젝트: ${r.pro}`,
                `내역: ${r.desc}`
            ];

            const textImage = createTextImage(lines);

            const textHeight =
                textWidth *
                textImage.height /
                textImage.width;

            let photoData = null;
            let photoHeight = 0;

            if (r.photo) {

                try {

                    const result =
                        await getPdfPhoto(r.photo);

                    photoHeight =
                        photoWidth *
                        result.height /
                        result.width;

                    photoData =
                        await blobToDataUrl(result.blob);

                } catch (error) {

                    console.warn(
                        "PDF 사진 처리 실패:",
                        error
                    );
                }
            }

            let rowHeight = Math.max(
                photoHeight,
                textHeight,
                30
            );

            // A4 페이지를 넘으면 새 페이지
            if (
                y + rowHeight >
                pageHeight - margin &&
                y > margin
            ) {
                doc.addPage();
                y = margin;
            }

            const availableHeight =
                pageHeight - margin - y;

            // 이미지가 페이지보다 큰 경우 축소
            let photoW = photoWidth;
            let photoH = photoHeight;

            if (
                photoData &&
                photoH > availableHeight
            ) {
                const scale =
                    availableHeight / photoH;

                photoW *= scale;
                photoH *= scale;
            }

            if (photoData) {

                doc.addImage(
                    photoData,
                    "JPEG",
                    margin,
                    y,
                    photoW,
                    photoH,
                    undefined,
                    "FAST"
                );
            }

            const finalTextHeight = Math.min(
                textHeight,
                availableHeight
            );

            doc.addImage(
                textImage.data,
                "PNG",
                textX,
                y,
                textWidth,
                finalTextHeight,
                undefined,
                "FAST"
            );

            rowHeight = Math.max(
                photoH,
                finalTextHeight,
                30
            );

            y += rowHeight + gap;

            // 브라우저 화면 갱신
            await wait(0);
        }

        const pdfBlob = doc.output("blob");

        const pdfFile = new File(
            [pdfBlob],
            `법인카드사진_${todayString()}.pdf`,
            { type: "application/pdf" }
        );

        // 모바일 공유 기능
        if (
            navigator.canShare &&
            navigator.canShare({
                files: [pdfFile]
            })
        ) {

            try {

                await navigator.share({
                    files: [pdfFile],
                    title: "법인카드 내역",
                    text:
                        `법인카드 내역 공유 (${todayString()})`
                });

            } catch (error) {

                if (error.name !== "AbortError") {
                    console.error(error);
                    downloadFile(pdfFile);
                }
            }

        } else {

            // 공유 미지원 환경에서는 다운로드
            downloadFile(pdfFile);
        }

    } catch (error) {

        console.error("PDF 생성 오류:", error);

        alert(
            "PDF 생성 중 오류가 발생했습니다.\n" +
            error.message
        );

    } finally {

        button.disabled = false;
        button.textContent = "공유하기";
    }
}

// =======================================
// 초기화
// =======================================

async function initialize() {

    try {

        await openDB();

        // 사용자 복원
        const savedUser =
            localStorage.getItem("selectedUser");

        if (savedUser) {
            $("user").value = savedUser;
        }

        // 내역 복원
        const savedDesc =
            localStorage.getItem("wdesc");

        if (savedDesc) {
            $("desc").value = savedDesc;
        }

        // 프로젝트 복원
        const savedPro =
            localStorage.getItem("wpro");

        if (savedPro) {
            $("pro").value = savedPro;
        }

        // 오늘 날짜
        $("date").value = todayString();

        // 사용자 변경 시 기억
        $("user").addEventListener(
            "change",
            () => {
                localStorage.setItem(
                    "selectedUser",
                    $("user").value
                );
            }
        );

        // 사진 업로드
        $("photoButton").addEventListener(
            "click",
            showChoice
        );

        $("cameraInput").addEventListener(
            "change",
            previewImage
        );

        $("galleryInput").addEventListener(
            "change",
            previewImage
        );

        // 내역 추가
        $("cardForm").addEventListener(
            "submit",
            addRecord
        );

        // PDF 공유
        $("shareButton").addEventListener(
            "click",
            sendAllMail
        );

        // CSV 다운로드
        $("csvButton").addEventListener(
            "click",
            downloadCSV
        );

        // 히스토리 초기화
        $("clearButton").addEventListener(
            "click",
            clearHistory
        );

        // 히스토리 표시
        await renderHistory();

        console.log(
            `법인카드 내역 v${VERSION} 초기화 완료`
        );

    } catch (error) {

        console.error(
            "프로그램 초기화 실패:",
            error
        );

        alert(
            "프로그램 초기화 실패\n" +
            error.message
        );
    }
}

// =======================================
// 실행
// =======================================

initialize();

</script>
