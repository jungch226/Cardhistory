
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법인카드 내역 v2.2</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
body {
    background: #f8f9fa;
}
.main {
    max-width: 480px;
    margin: auto;
}
#previewBox {
    height: 190px;
    max-width: 320px;
    border: 2px dashed #ced4da;
    border-radius: 8px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
#preview {
    display: none;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}
.entry {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    overflow-wrap: anywhere;
}
.entry img {
    max-width: 110px;
    max-height: 110px;
    object-fit: contain;
    display: block;
    margin-top: 8px;
}
#imageInfo {
    white-space: pre-wrap;
}
</style>
</head>

<body>
<div class="container py-4">

<h2 class="text-center mb-4">법인카드 내역(v2.2)</h2>

<form id="cardForm" class="main">

    <div class="mb-3">
        <label class="form-label" for="user">사용자</label>
        <select id="user" class="form-select" required>
            <option value="">선택하세요</option>
            <option>김동혁</option>
            <option>신경용</option>
            <option>정재원</option>
            <option>이주홍</option>
            <option>정채호</option>
            <option>김현재</option>
            <option>조성원</option>
            <option>문성인</option>
            <option>현혜영</option>
            <option>변지호</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label" for="desc">내역</label>
        <input id="desc" class="form-control"
               placeholder="예: 식비(정채호)" required>
    </div>

    <div class="mb-3">
        <label class="form-label" for="pro">프로젝트</label>
        <input id="pro" class="form-control"
               placeholder="예: 순천 POSCO 형상 모니터링" required>
    </div>

    <div class="mb-3">
        <label class="form-label" for="date">날짜</label>
        <input type="date" id="date" class="form-control" required>
    </div>

    <div class="mb-3">
        <button id="photoButton" type="button"
                class="btn btn-primary mb-2">
            사진 업로드
        </button>

        <input id="cameraInput" type="file"
               accept="image/*" capture="environment" hidden>

        <input id="galleryInput" type="file"
               accept="image/*" hidden>

        <div id="previewBox">
            <span id="previewText">이미지 미리보기</span>
            <img id="preview" alt="사진 미리보기">
        </div>

        <small id="imageInfo"
               class="text-muted d-block mt-2"
               aria-live="polite"></small>
    </div>

    <div class="d-grid gap-2">
        <button id="addButton" class="btn btn-success"
                type="submit">내역 추가</button>

        <button id="shareButton" class="btn btn-secondary"
                type="button">공유하기 (PDF)</button>

        <button id="csvButton" class="btn btn-outline-secondary"
                type="button">CSV 다운로드</button>

        <button id="clearButton" class="btn btn-danger"
                type="button">히스토리 초기화</button>
    </div>

</form>

<hr>
<div id="historyList" class="main"></div>
</div>

<script>
"use strict";

// ========================================
// 기본 설정
// ========================================

const $ = id => document.getElementById(id);

const MAX_SIDE = 1600;
const QUALITY = 0.8;

let db;
let photoBlob = null;
let previewURL = null;
let historyURLs = [];

let photoBusy = false;
let saveBusy = false;
let photoToken = 0;

// ========================================
// 공통 함수
// ========================================

const day = () => {
    const d = new Date();

    return `${d.getFullYear()}-${String(
        d.getMonth() + 1
    ).padStart(2, "0")}-${String(
        d.getDate()
    ).padStart(2, "0")}`;
};

const kb = n => `${Math.round(n / 1024)}KB`;

// ========================================
// IndexedDB
// ========================================

function openDB() {
    return new Promise((resolve, reject) => {
        const r = indexedDB.open("CardDB", 1);

        r.onupgradeneeded = () => {
            const d = r.result;

            if (!d.objectStoreNames.contains("cards")) {
                const s = d.createObjectStore("cards", {
                    keyPath: "id",
                    autoIncrement: true
                });

                s.createIndex("user", "user", {
                    unique: false
                });
            }
        };

        r.onsuccess = () => {
            db = r.result;
            resolve();
        };

        r.onerror = () => reject(r.error);
    });
}

function dbOp(mode, action) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction("cards", mode);
        const r = action(tx.objectStore("cards"));

        let value;

        r.onsuccess = () => {
            value = r.result;
        };

        tx.oncomplete = () => resolve(value);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(
            tx.error || Error("DB 취소")
        );
    });
}

const records = () =>
    dbOp("readonly", s => s.getAll());

// ========================================
// 사진 초기화
// ========================================

function revokePreview() {
    if (previewURL) {
        URL.revokeObjectURL(previewURL);
        previewURL = null;
    }
}

function clearPhoto() {
    photoToken++;
    photoBlob = null;
    photoBusy = false;

    const img = $("preview");

    img.removeAttribute("src");
    img.style.display = "none";

    $("previewText").style.display = "";

    revokePreview();

    $("imageInfo").textContent = "";

    $("cameraInput").value = "";
    $("galleryInput").value = "";

    $("addButton").disabled = saveBusy;
}

// ========================================
// 이미지 로딩
// ========================================

function loadImageURL(url) {
    return new Promise((resolve, reject) => {
        const img = new Image();

        img.onload = () => resolve(img);

        img.onerror = () => reject(
            Error("브라우저가 사진 형식을 읽지 못했습니다.")
        );

        img.src = url;
    });
}

// ========================================
// 이미지 압축
// ========================================

async function imageToJpeg(file) {
    let bitmap = null;
    let url = null;
    let canvas = null;

    try {
        let source;

        const mime = file.type || "알 수 없음";

        // 갤럭시 고해상도 사진 축소 디코딩 시도
        if (typeof createImageBitmap === "function") {
            try {
                const probe = await createImageBitmap(file, {
                    imageOrientation: "from-image",
                    resizeWidth: MAX_SIDE,
                    resizeQuality: "high"
                });

                if (probe.width > 0 && probe.height > 0) {
                    bitmap = probe;
                    source = probe;
                }
            } catch (e) {
                console.warn("축소 디코딩 미지원:", e);
            }
        }

        // ImageBitmap 실패 시 일반 이미지 로딩
        if (!source) {
            url = URL.createObjectURL(file);
            source = await loadImageURL(url);
        }

        const w = source.naturalWidth || source.width;
        const h = source.naturalHeight || source.height;

        if (!w || !h) {
            throw Error("사진 해상도 확인 실패");
        }

        const scale = Math.min(
            1,
            MAX_SIDE / Math.max(w, h)
        );

        const width = Math.max(
            1,
            Math.round(w * scale)
        );

        const height = Math.max(
            1,
            Math.round(h * scale)
        );

        canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d", {
            alpha: false
        });

        if (!ctx) {
            throw Error("이미지 캔버스 생성 실패");
        }

        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, width, height);

        ctx.drawImage(source, 0, 0, width, height);

        const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(
                b => b
                    ? resolve(b)
                    : reject(Error("JPEG 압축 실패")),
                "image/jpeg",
                QUALITY
            );
        });

        if (blob.type !== "image/jpeg") {
            throw Error("JPEG 인코딩을 지원하지 않습니다");
        }

        return {
            blob,
            width,
            height,
            mime
        };

    } finally {
        if (bitmap) bitmap.close();
        if (url) URL.revokeObjectURL(url);

        if (canvas) {
            canvas.width = 0;
            canvas.height = 0;
        }
    }
}

// ========================================
// 카메라 및 갤러리 사진 선택
// ========================================

async function choosePhoto(e) {
    const file = e.target.files && e.target.files[0];

    if (!file) return;

    clearPhoto();

    const token = ++photoToken;

    photoBusy = true;
    $("addButton").disabled = true;

    $("imageInfo").textContent =
        `사진 처리 중... (${kb(file.size)}, ` +
        `${file.type || "형식 미확인"})`;

    let url = null;

    try {
        const result = await imageToJpeg(file);

        if (token !== photoToken) return;

        url = URL.createObjectURL(result.blob);

        // 압축된 이미지가 정상적으로 열리는지 확인
        await loadImageURL(url);

        if (token !== photoToken) return;

        const img = $("preview");

        img.src = url;
        img.style.display = "block";

        $("previewText").style.display = "none";

        revokePreview();

        previewURL = url;
        url = null;

        photoBlob = result.blob;

        $("imageInfo").textContent =
            `압축 완료: ${kb(file.size)} → ` +
            `${kb(result.blob.size)} / ` +
            `${result.width}×${result.height}`;

    } catch (err) {
        console.error("사진 처리 실패", err);

        if (token === photoToken) {
            photoBlob = null;

            $("imageInfo").textContent =
                `사진 처리 실패: ${err.message}\n` +
                `원본 형식: ${file.type || "알 수 없음"}`;

            alert(
                "사진을 표시하지 못했습니다.\n" +
                err.message + "\n" +
                "갤럭시 카메라의 고효율 사진(HEIF) " +
                "설정을 꺼서 다시 촬영해 보세요."
            );
        }

    } finally {
        if (url) URL.revokeObjectURL(url);

        if (token === photoToken) {
            photoBusy = false;
            $("addButton").disabled = saveBusy;
        }
    }
}

// ========================================
// 사진 URL 변환
// ========================================

function photoURL(p) {
    if (p instanceof Blob) {
        return {
            url: URL.createObjectURL(p),
            revoke: true
        };
    }

    if (
        typeof p === "string" &&
        p.startsWith("data:image/")
    ) {
        return {
            url: p,
            revoke: false
        };
    }

    return null;
}

// ========================================
// 히스토리 표시
// ========================================

async function renderHistory() {
    const list = $("historyList");

    list.replaceChildren();

    historyURLs.forEach(u => URL.revokeObjectURL(u));
    historyURLs = [];

    const all = (await records()).sort(
        (a, b) => b.id - a.id
    );

    if (!all.length) {
        list.textContent = "등록된 내역이 없습니다.";
        return;
    }

    for (const r of all) {
        const div = document.createElement("div");

        div.className =
            "entry d-flex justify-content-between " +
            "align-items-start gap-2";

        const left = document.createElement("div");
        left.style.minWidth = "0";

        const title = document.createElement("b");
        title.textContent = `${r.user} (${r.date})`;

        left.append(title);

        for (const line of [
            `내역: ${r.desc}`,
            `프로젝트: ${r.pro}`
        ]) {
            const p = document.createElement("div");
            p.textContent = line;
            left.append(p);
        }

        const ph = photoURL(r.photo);

        if (ph) {
            const img = document.createElement("img");

            img.loading = "lazy";
            img.src = ph.url;
            img.alt = "영수증";

            left.append(img);

            if (ph.revoke) {
                historyURLs.push(ph.url);
            }
        }

        const btn = document.createElement("button");

        btn.className = "btn btn-sm btn-danger";
        btn.textContent = "삭제";

        btn.onclick = async () => {
            if (!confirm("정말 삭제하시겠습니까?")) {
                return;
            }

            await dbOp(
                "readwrite",
                s => s.delete(r.id)
            );

            await renderHistory();
        };

        div.append(left, btn);
        list.append(div);
    }
}

// ========================================
// 내역 추가
// ========================================

async function addRecord(e) {
    e.preventDefault();

    if (saveBusy || photoBusy) return;

    const user = $("user").value;
    const desc = $("desc").value.trim();
    const pro = $("pro").value.trim();
    const date = $("date").value;

    if (!user || !desc || !pro || !date) {
        alert("모든 항목을 입력해주세요.");
        return;
    }

    saveBusy = true;
    $("addButton").disabled = true;

    try {
        await dbOp("readwrite", s => s.add({
            user,
            desc,
            pro,
            date,
            photo: photoBlob || ""
        }));

        localStorage.setItem("selectedUser", user);
        localStorage.setItem("wdesc", desc);
        localStorage.setItem("wpro", pro);

        clearPhoto();

        await renderHistory();

    } catch (err) {
        console.error(err);
        alert("저장 실패: " + err.message);

    } finally {
        saveBusy = false;
        $("addButton").disabled = photoBusy;
    }
}

// ========================================
// CSV
// ========================================

function csvEscape(s) {
    return '"' +
        String(s ?? "").replace(/"/g, '""') +
        '"';
}

function csvFile(rows) {
    const content =
        "No.,날짜,사용자,프로젝트,내역\r\n" +
        rows.map((r, i) =>
            [
                i + 1,
                r.date,
                r.user,
                r.pro,
                r.desc
            ].map(csvEscape).join(",")
        ).join("\r\n");

    return new File(
        ["\ufeff" + content],
        `법인카드내역_${day()}.csv`,
        { type: "text/csv;charset=utf-8" }
    );
}

// ========================================
// 파일 다운로드
// ========================================

function download(file) {
    const u = URL.createObjectURL(file);
    const a = document.createElement("a");

    a.href = u;
    a.download = file.name;

    document.body.append(a);
    a.click();
    a.remove();

    setTimeout(() => {
        URL.revokeObjectURL(u);
    }, 60000);
}

// ========================================
// Base64 변환
// ========================================

function base64Blob(s) {
    const [header, data] = s.split(",");

    const mime =
        (header.match(/data:([^;]+)/) || [])[1] ||
        "image/jpeg";

    const binary = atob(data);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return new Blob([bytes], { type: mime });
}

function blobDataURL(blob) {
    return new Promise((resolve, reject) => {
        const r = new FileReader();

        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error);

        r.readAsDataURL(blob);
    });
}

// ========================================
// PDF용 한글 텍스트 이미지
// ========================================

function textImage(lines) {
    const c = document.createElement("canvas");

    const w = 800;
    const p = 25;
    const lh = 38;

    c.width = w;

    const ctx = c.getContext("2d");
    ctx.font = "26px sans-serif";

    const wrapped = [];

    for (const line of lines) {
        let current = "";

        for (const ch of line) {
            if (
                current &&
                ctx.measureText(current + ch).width >
                w - p * 2
            ) {
                wrapped.push(current);
                current = ch;
            } else {
                current += ch;
            }
        }

        wrapped.push(current);
    }

    c.height = p * 2 + wrapped.length * lh;

    const x = c.getContext("2d");

    x.fillStyle = "#fff";
    x.fillRect(0, 0, c.width, c.height);

    x.fillStyle = "#000";
    x.font = "26px sans-serif";
    x.textBaseline = "top";

    wrapped.forEach((s, i) => {
        x.fillText(s, p, p + i * lh);
    });

    const out = {
        data: c.toDataURL("image/png"),
        ratio: c.height / c.width
    };

    c.width = 0;
    c.height = 0;

    return out;
}

// ========================================
// PDF 생성 및 공유
// ========================================

async function sharePDF() {
    const btn = $("shareButton");
    btn.disabled = true;

    try {
        const all = await records();

        if (!all.length) {
            alert("저장된 내역이 없습니다.");
            return;
        }

        if (!window.jspdf) {
            throw Error(
                "PDF 라이브러리를 불러오지 못했습니다"
            );
        }

        const { jsPDF } = window.jspdf;

        const doc = new jsPDF({
            unit: "mm",
            format: "a4",
            compress: true
        });

        const W = doc.internal.pageSize.getWidth();
        const H = doc.internal.pageSize.getHeight();

        const margin = 10;
        const photoW = 65;
        const textX = 80;
        const textW = W - textX - margin;

        let y = margin;

        for (let i = 0; i < all.length; i++) {
            btn.textContent =
                `PDF 생성 ${i + 1}/${all.length}`;

            const r = all[i];

            const txt = textImage([
                `사용자: ${r.user}`,
                `날짜: ${r.date}`,
                `프로젝트: ${r.pro}`,
                `내역: ${r.desc}`
            ]);

            let data = null;
            let iw = 0;
            let ih = 0;

            if (r.photo) {
                try {
                    const raw = r.photo instanceof Blob
                        ? r.photo
                        : base64Blob(r.photo);

                    const out = await imageToJpeg(raw);

                    data = await blobDataURL(out.blob);

                    iw = photoW;
                    ih = photoW * out.height / out.width;

                } catch (err) {
                    console.warn("사진 제외:", err);
                }
            }

            const th = textW * txt.ratio;

            const factor = Math.min(
                1,
                (H - 2 * margin) /
                Math.max(th, ih, 1)
            );

            const rowH = Math.max(th, ih) * factor;

            if (y + rowH > H - margin) {
                doc.addPage();
                y = margin;
            }

            if (data) {
                doc.addImage(
                    data,
                    "JPEG",
                    margin,
                    y,
                    iw * factor,
                    ih * factor,
                    undefined,
                    "FAST"
                );
            }

            doc.addImage(
                txt.data,
                "PNG",
                textX,
                y,
                textW * factor,
                th * factor,
                undefined,
                "FAST"
            );

            y += rowH + 6;

            await new Promise(resolve =>
                setTimeout(resolve, 0)
            );
        }

        const file = new File(
            [doc.output("blob")],
            `법인카드사진_${day()}.pdf`,
            { type: "application/pdf" }
        );

        if (
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {
            try {
                await navigator.share({
                    files: [file],
                    title: "법인카드 내역",
                    text: `법인카드 내역 공유 (${day()})`
                });

            } catch (err) {
                if (err.name !== "AbortError") {
                    console.error(err);
                    download(file);
                }
            }

        } else {
            download(file);
        }

    } catch (err) {
        console.error(err);
        alert("PDF 생성 실패: " + err.message);

    } finally {
        btn.disabled = false;
        btn.textContent = "공유하기 (PDF)";
    }
}

// ========================================
// 초기화
// ========================================

async function init() {
    try {
        await openDB();

        $("user").value =
            localStorage.getItem("selectedUser") || "";

        $("desc").value =
            localStorage.getItem("wdesc") || "";

        $("pro").value =
            localStorage.getItem("wpro") || "";

        $("date").value = day();

        $("user").onchange = () => {
            localStorage.setItem(
                "selectedUser",
                $("user").value
            );
        };

        $("photoButton").onclick = () => {
            if (photoBusy) return;

            const camera = confirm(
                "사진을 직접 촬영하시겠습니까?\n" +
                "확인: 카메라 / 취소: 갤러리"
            );

            if (camera) {
                $("cameraInput").value = "";
                $("cameraInput").click();
            } else {
                $("galleryInput").value = "";
                $("galleryInput").click();
            }
        };

        $("cameraInput").onchange = choosePhoto;
        $("galleryInput").onchange = choosePhoto;

        $("cardForm").onsubmit = addRecord;

        $("shareButton").onclick = sharePDF;

        $("csvButton").onclick = async () => {
            const all = await records();

            if (!all.length) {
                alert("저장된 내역이 없습니다.");
                return;
            }

            download(csvFile(all));
        };

        $("clearButton").onclick = async () => {
            if (!confirm("모든 내역을 삭제하시겠습니까?")) {
                return;
            }

            await dbOp(
                "readwrite",
                s => s.clear()
            );

            await renderHistory();
        };

        await renderHistory();

    } catch (err) {
        console.error(err);
        alert("초기화 실패: " + err.message);
    }
}

init();
</script>
